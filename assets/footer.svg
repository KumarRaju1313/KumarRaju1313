<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-labelledby="title">
  <title id="title">Data, insights, decisions — thanks for visiting</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#121B31"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="130" rx="22"/></clipPath>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq 2.4s ease-in-out infinite}
    @keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="130" fill="url(#bg)"/>
    <!-- soft equalizer bars along the bottom -->
    <g opacity=".22">
      <rect class="eq" x="20"   y="70" width="14" height="60" rx="3" fill="#2DD4BF" style="animation-delay:-.1s"/>
      <rect class="eq" x="44"   y="70" width="14" height="60" rx="3" fill="#2DD4BF" style="animation-delay:-.5s"/>
      <rect class="eq" x="68"   y="70" width="14" height="60" rx="3" fill="#2DD4BF" style="animation-delay:-.9s"/>
      <rect class="eq" x="92"   y="70" width="14" height="60" rx="3" fill="#F2C811" style="animation-delay:-1.3s"/>
      <rect class="eq" x="116"  y="70" width="14" height="60" rx="3" fill="#2DD4BF" style="animation-delay:-1.7s"/>
      <rect class="eq" x="140"  y="70" width="14" height="60" rx="3" fill="#2DD4BF" style="animation-delay:-2.1s"/>
      <rect class="eq" x="1046" y="70" width="14" height="60" rx="3" fill="#FF5F6D" style="animation-delay:-.3s"/>
      <rect class="eq" x="1070" y="70" width="14" height="60" rx="3" fill="#FF5F6D" style="animation-delay:-.7s"/>
      <rect class="eq" x="1094" y="70" width="14" height="60" rx="3" fill="#F2C811" style="animation-delay:-1.1s"/>
      <rect class="eq" x="1118" y="70" width="14" height="60" rx="3" fill="#FF5F6D" style="animation-delay:-1.5s"/>
      <rect class="eq" x="1142" y="70" width="14" height="60" rx="3" fill="#FF5F6D" style="animation-delay:-1.9s"/>
      <rect class="eq" x="1166" y="70" width="14" height="60" rx="3" fill="#FF5F6D" style="animation-delay:-2.3s"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="129" rx="22" fill="none" stroke="#1E293B"/>

  <text x="600" y="60" class="sans" font-size="30" font-weight="800" fill="#F8FAFC" text-anchor="middle">Data <tspan fill="#F2C811">→</tspan> Insights <tspan fill="#2DD4BF">→</tspan> Decisions</text>
  <text x="600" y="92" class="mono" font-size="14" fill="#94A3B8" text-anchor="middle" letter-spacing="1">thanks for visiting · end of report</text>
</svg>
