<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Neela Kumar Raju — profile dashboard</title>
  <desc id="desc">Executive – MIS at HBL Engineering Ltd. B.Com graduate, upskilling in Data Science and AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#121B31"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5F6D" stop-opacity=".30"/>
      <stop offset="1" stop-color="#FF5F6D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F2C811"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="400" rx="22"/></clipPath>
  </defs>

  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .fade{animation:fade .8s ease-out both}
    .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
    .line{stroke-dasharray:100;animation:draw 1.8s ease-out 1s both}
    .areaFill{animation:fade 1.2s ease-out 1.6s both}
    .dot{animation:fade .4s ease-out 2.4s both}
    .live{animation:pulse 1.6s ease-in-out infinite}
    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    @keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
    @keyframes blink{0%{fill-opacity:1}50%{fill-opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect y="52" width="1200" height="348" fill="url(#grid)" opacity=".45"/>

    <!-- window bar -->
    <rect width="1200" height="52" fill="#0E1628"/>
    <line x1="0" y1="52" x2="1200" y2="52" stroke="#1E293B"/>
    <circle cx="30" cy="26" r="6" fill="#FF5F6D"/>
    <circle cx="52" cy="26" r="6" fill="#F2C811"/>
    <circle cx="74" cy="26" r="6" fill="#2DD4BF"/>
    <rect x="100" y="11" width="250" height="30" rx="8" fill="#121B31" stroke="#1E293B"/>
    <text x="116" y="31" class="mono" font-size="13" fill="#CBD5E1">kumar_raju_profile.pbix</text>
    <text x="380" y="31" class="mono" font-size="13" fill="#64748B">Page 1 of 5</text>
    <circle class="live" cx="1104" cy="26" r="5" fill="#2DD4BF"/>
    <text x="1164" y="31" class="mono" font-size="13" fill="#2DD4BF" text-anchor="end" letter-spacing="2">LIVE</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="22" fill="none" stroke="#1E293B"/>

  <!-- left: identity -->
  <text x="60" y="108" class="mono fade" font-size="14" fill="#F2C811" letter-spacing="3" style="animation-delay:.1s">REPORT · PROFILE OVERVIEW</text>
  <text x="58" y="172" class="sans fade" font-size="58" font-weight="800" fill="url(#nameGrad)" style="animation-delay:.25s">Neela Kumar Raju</text>
  <text x="60" y="214" class="sans fade" font-size="21" fill="#CBD5E1" style="animation-delay:.45s">MIS Executive  ·  Data Analyst  ·  Data Science &amp; AI</text>
  <g class="fade" style="animation-delay:.65s">
    <text x="60" y="256" class="mono" font-size="16" fill="#94A3B8"><tspan fill="#2DD4BF">&gt;</tspan> data <tspan fill="#F2C811">→</tspan> insights <tspan fill="#F2C811">→</tspan> decisions<tspan class="cursor" fill="#F2C811" font-weight="700">_</tspan></text>
  </g>

  <!-- right: chart panel -->
  <g class="fade" style="animation-delay:.2s">
    <rect x="760" y="76" width="390" height="194" rx="14" fill="#0E1628" stroke="#1E293B"/>
    <text x="782" y="102" class="mono" font-size="12" fill="#94A3B8" letter-spacing="1">insights.trend()</text>
    <circle cx="954" cy="98" r="4" fill="#2DD4BF"/>
    <text x="964" y="102" class="mono" font-size="11" fill="#64748B">data</text>
    <circle cx="1008" cy="98" r="4" fill="#FF5F6D"/>
    <text x="1018" y="102" class="mono" font-size="11" fill="#64748B">trend</text>
    <line x1="782" y1="250" x2="1128" y2="250" stroke="#334155"/>
  </g>

  <g fill="#2DD4BF" opacity=".9">
    <rect class="bar" x="792"  y="210" width="26" height="40"  rx="4" style="animation-delay:.30s"/>
    <rect class="bar" x="834"  y="188" width="26" height="62"  rx="4" style="animation-delay:.38s"/>
    <rect class="bar" x="876"  y="198" width="26" height="52"  rx="4" style="animation-delay:.46s"/>
    <rect class="bar" x="918"  y="166" width="26" height="84"  rx="4" style="animation-delay:.54s"/>
    <rect class="bar" x="960"  y="174" width="26" height="76"  rx="4" style="animation-delay:.62s"/>
    <rect class="bar" x="1002" y="146" width="26" height="104" rx="4" style="animation-delay:.70s"/>
    <rect class="bar" x="1044" y="154" width="26" height="96"  rx="4" style="animation-delay:.78s"/>
    <rect class="bar" x="1086" y="124" width="26" height="126" rx="4" fill="#F2C811" style="animation-delay:.86s"/>
  </g>

  <path class="areaFill" d="M805 194 C826 180 835 176 847 172 S876 184 889 182 S918 152 931 150 S960 160 973 158 S1002 132 1015 130 S1044 140 1057 138 S1086 112 1099 108 L1099 250 L805 250 Z" fill="url(#area)"/>
  <path class="line" pathLength="100" d="M805 194 C826 180 835 176 847 172 S876 184 889 182 S918 152 931 150 S960 160 973 158 S1002 132 1015 130 S1044 140 1057 138 S1086 112 1099 108" fill="none" stroke="#FF5F6D" stroke-width="3" stroke-linecap="round"/>
  <g class="dot" fill="#0E1628" stroke="#FF5F6D" stroke-width="2.5">
    <circle cx="805" cy="194" r="4"/>
    <circle cx="931" cy="150" r="4"/>
    <circle cx="1015" cy="130" r="4"/>
    <circle cx="1099" cy="108" r="5.5" fill="#FF5F6D"/>
  </g>

  <!-- KPI tiles -->
  <g class="fade" style="animation-delay:.9s">
    <rect x="40" y="292" width="265" height="78" rx="12" fill="#0E1628" stroke="#1E293B"/>
    <rect x="56" y="310" width="4" height="42" rx="2" fill="#F2C811"/>
    <text x="74" y="324" class="mono" font-size="11.5" fill="#94A3B8" letter-spacing="2">CURRENT ROLE</text>
    <text x="74" y="351" class="sans" font-size="19" font-weight="700" fill="#F8FAFC">Executive – MIS</text>
  </g>
  <g class="fade" style="animation-delay:1.05s">
    <rect x="325" y="292" width="265" height="78" rx="12" fill="#0E1628" stroke="#1E293B"/>
    <rect x="341" y="310" width="4" height="42" rx="2" fill="#2DD4BF"/>
    <text x="359" y="324" class="mono" font-size="11.5" fill="#94A3B8" letter-spacing="2">COMPANY</text>
    <text x="359" y="351" class="sans" font-size="19" font-weight="700" fill="#F8FAFC">HBL Engineering Ltd.</text>
  </g>
  <g class="fade" style="animation-delay:1.2s">
    <rect x="610" y="292" width="265" height="78" rx="12" fill="#0E1628" stroke="#1E293B"/>
    <rect x="626" y="310" width="4" height="42" rx="2" fill="#FF5F6D"/>
    <text x="644" y="324" class="mono" font-size="11.5" fill="#94A3B8" letter-spacing="2">EDUCATION</text>
    <text x="644" y="351" class="sans" font-size="19" font-weight="700" fill="#F8FAFC">B.Com Graduate</text>
  </g>
  <g class="fade" style="animation-delay:1.35s">
    <rect x="895" y="292" width="265" height="78" rx="12" fill="#0E1628" stroke="#1E293B"/>
    <rect x="911" y="310" width="4" height="42" rx="2" fill="#60A5FA"/>
    <text x="929" y="324" class="mono" font-size="11.5" fill="#94A3B8" letter-spacing="2">UPSKILLING</text>
    <text x="929" y="351" class="sans" font-size="19" font-weight="700" fill="#F8FAFC">Data Science &amp; AI</text>
  </g>
</svg>
