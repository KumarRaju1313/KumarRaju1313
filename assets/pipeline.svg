<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">How I turn raw data into decisions</title>
  <desc id="desc">Five steps: Collect with Excel and SQL, Clean with Pandas and NumPy, Analyze with Python and Advanced Excel, Model with scikit-learn, ML, DL and NLP, Report with Power BI and MIS dashboards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#121B31"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2C811"/>
      <stop offset=".5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#FF5F6D"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset=".4" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .dash{stroke-dasharray:6 10;animation:flow 1s linear infinite}
    .packet{animation:travel 5s linear infinite}
    .node{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
    @keyframes flow{to{stroke-dashoffset:-16}}
    @keyframes travel{from{transform:translateX(0)}to{transform:translateX(1120px)}}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <rect x=".5" y=".5" width="1199" height="259" rx="22" fill="url(#bg)" stroke="#1E293B"/>

  <!-- flowing data line (behind the nodes) -->
  <line class="dash" x1="40" y1="113" x2="1160" y2="113" stroke="url(#flow)" stroke-width="3" stroke-linecap="round"/>
  <circle class="packet" cx="40" cy="113" r="9" fill="url(#glow)"/>
  <circle class="packet" cx="40" cy="113" r="9" fill="url(#glow)" style="animation-delay:-2.5s"/>

  <!-- 01 COLLECT -->
  <g class="node" style="animation-delay:.05s">
    <rect x="40" y="36" width="200" height="154" rx="14" fill="#0E1628" stroke="#1E293B"/>
    <rect x="40" y="36" width="200" height="4" rx="2" fill="#F2C811"/>
    <circle cx="70" cy="70" r="14" fill="#F2C811"/>
    <text x="70" y="75" class="mono" font-size="13" font-weight="700" fill="#0B1120" text-anchor="middle">01</text>
    <text x="94" y="75" class="mono" font-size="12" fill="#94A3B8" letter-spacing="2">STEP</text>
    <text x="58" y="120" class="sans" font-size="22" font-weight="800" fill="#F8FAFC">Collect</text>
    <text x="58" y="148" class="sans" font-size="14" fill="#94A3B8">Excel sheets</text>
    <text x="58" y="168" class="sans" font-size="14" fill="#94A3B8">SQL queries</text>
  </g>

  <!-- 02 CLEAN -->
  <g class="node" style="animation-delay:.2s">
    <rect x="270" y="36" width="200" height="154" rx="14" fill="#0E1628" stroke="#1E293B"/>
    <rect x="270" y="36" width="200" height="4" rx="2" fill="#2DD4BF"/>
    <circle cx="300" cy="70" r="14" fill="#2DD4BF"/>
    <text x="300" y="75" class="mono" font-size="13" font-weight="700" fill="#0B1120" text-anchor="middle">02</text>
    <text x="324" y="75" class="mono" font-size="12" fill="#94A3B8" letter-spacing="2">STEP</text>
    <text x="288" y="120" class="sans" font-size="22" font-weight="800" fill="#F8FAFC">Clean</text>
    <text x="288" y="148" class="sans" font-size="14" fill="#94A3B8">Pandas · NumPy</text>
    <text x="288" y="168" class="sans" font-size="14" fill="#94A3B8">Reconciliation</text>
  </g>

  <!-- 03 ANALYZE -->
  <g class="node" style="animation-delay:.35s">
    <rect x="500" y="36" width="200" height="154" rx="14" fill="#0E1628" stroke="#1E293B"/>
    <rect x="500" y="36" width="200" height="4" rx="2" fill="#60A5FA"/>
    <circle cx="530" cy="70" r="14" fill="#60A5FA"/>
    <text x="530" y="75" class="mono" font-size="13" font-weight="700" fill="#0B1120" text-anchor="middle">03</text>
    <text x="554" y="75" class="mono" font-size="12" fill="#94A3B8" letter-spacing="2">STEP</text>
    <text x="518" y="120" class="sans" font-size="22" font-weight="800" fill="#F8FAFC">Analyze</text>
    <text x="518" y="148" class="sans" font-size="14" fill="#94A3B8">Python</text>
    <text x="518" y="168" class="sans" font-size="14" fill="#94A3B8">Advanced Excel</text>
  </g>

  <!-- 04 MODEL -->
  <g class="node" style="animation-delay:.5s">
    <rect x="730" y="36" width="200" height="154" rx="14" fill="#0E1628" stroke="#1E293B"/>
    <rect x="730" y="36" width="200" height="4" rx="2" fill="#A78BFA"/>
    <circle cx="760" cy="70" r="14" fill="#A78BFA"/>
    <text x="760" y="75" class="mono" font-size="13" font-weight="700" fill="#0B1120" text-anchor="middle">04</text>
    <text x="784" y="75" class="mono" font-size="12" fill="#94A3B8" letter-spacing="2">STEP</text>
    <text x="748" y="120" class="sans" font-size="22" font-weight="800" fill="#F8FAFC">Model</text>
    <text x="748" y="148" class="sans" font-size="14" fill="#94A3B8">scikit-learn</text>
    <text x="748" y="168" class="sans" font-size="14" fill="#94A3B8">ML · DL · NLP</text>
  </g>

  <!-- 05 REPORT -->
  <g class="node" style="animation-delay:.65s">
    <rect x="960" y="36" width="200" height="154" rx="14" fill="#0E1628" stroke="#1E293B"/>
    <rect x="960" y="36" width="200" height="4" rx="2" fill="#FF5F6D"/>
    <circle cx="990" cy="70" r="14" fill="#FF5F6D"/>
    <text x="990" y="75" class="mono" font-size="13" font-weight="700" fill="#0B1120" text-anchor="middle">05</text>
    <text x="1014" y="75" class="mono" font-size="12" fill="#94A3B8" letter-spacing="2">STEP</text>
    <text x="978" y="120" class="sans" font-size="22" font-weight="800" fill="#F8FAFC">Report</text>
    <text x="978" y="148" class="sans" font-size="14" fill="#94A3B8">Power BI</text>
    <text x="978" y="168" class="sans" font-size="14" fill="#94A3B8">MIS dashboards</text>
  </g>

  <!-- chevrons between steps -->
  <g fill="none" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".8">
    <path d="M250 106 l7 7 -7 7"/>
    <path d="M480 106 l7 7 -7 7"/>
    <path d="M710 106 l7 7 -7 7"/>
    <path d="M940 106 l7 7 -7 7"/>
  </g>

  <!-- raw data → decisions -->
  <text x="40" y="226" class="mono" font-size="13" fill="#F2C811" letter-spacing="2">RAW DATA</text>
  <line x1="140" y1="222" x2="1036" y2="222" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 6"/>
  <path d="M1030 216 l7 6 -7 6" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="1160" y="226" class="mono" font-size="13" fill="#FF5F6D" letter-spacing="2" text-anchor="end">DECISIONS</text>
</svg>
