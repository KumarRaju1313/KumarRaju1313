name: Refresh profile cards

# Builds the GitHub stats, top-languages and contribution-snake images
# inside this repo, so the profile README never depends on a public
# server that can go down.

on:
  schedule:
    - cron: "17 0 * * *" # every day (00:17 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=4&hide_border=true&border_radius=16&bg_color=0B1120&title_color=F2C811&text_color=CBD5E1
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-light.svg?color_snake=#F2C811
            profile/snake-dark.svg?palette=github-dark&color_snake=#F2C811

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          if git diff --cached --quiet; then
            echo "Cards are already up to date."
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
